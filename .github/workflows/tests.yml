name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Unit tests and smoke
        run: tools/check.sh

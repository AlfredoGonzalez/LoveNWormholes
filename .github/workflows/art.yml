name: Procesar arte

# Sube tus imágenes crudas a art-inbox/ (con el nombre exacto del archivo) y este flujo las procesa
# (quita fondos, corta cuadros, ajusta tamaños), guarda el resultado en public/assets/ y vuelve a publicar la demo.
on:
  push:
    branches: [main]
    paths: ['art-inbox/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Procesar art-inbox
        id: art
        run: npm run art
        continue-on-error: true
      - name: Guardar resultado y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if git diff --cached --quiet; then
            echo "Sin cambios en public/assets"
          else
            git commit -m "Arte: procesa art-inbox → public/assets"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
      - name: Avisar si alguna imagen falló
        if: steps.art.outcome == 'failure'
        run: |
          echo "Alguna imagen no se pudo procesar: revisa el paso «Procesar art-inbox» (nombre o fondo)."
          exit 1
